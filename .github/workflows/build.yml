name: Build (dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-win64:
    runs-on: windows-latest
    env:
      # .npmrc points at npmmirror (China); GitHub runners are faster from GitHub itself
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn --frozen-lockfile --non-interactive

      - name: Unit tests
        run: yarn test

      - name: Build Windows x64 zip
        run: yarn build:win64

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: zzz-signal-search-export-win64-${{ github.sha }}
          path: build/*.zip
          if-no-files-found: error
          retention-days: 30
